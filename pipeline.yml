name: 5-Stage CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    
    steps:
   
    - name: (1 & 2) Checkout Code from Repository
      uses: actions/checkout@v4

    
    - name: (3) Setup Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: (3) Install Test Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        
    - name: (3) Run Automated Unit Tests
      run: pytest test_app.py

 
    - name: (4) Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: (4) Build and Push Unique Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/billing-app:${{ github.run_id }}
          ${{ secrets.DOCKERHUB_USERNAME }}/billing-app:latest

    
    - name: (5) Setup Kubernetes Cluster Configuration
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBECONFIG }}

    - name: (5) Dynamically Inject Unique Tag & Deploy
      run: |
        sed -i 's/DOCKERHUB_USERNAME/${{ secrets.DOCKERHUB_USERNAME }}/g' k8s/deployment.yaml
        sed -i 's/__IMAGE_TAG__/${{ github.run_id }}/g' k8s/deployment.yaml
        kubectl apply -f k8s/deployment.yaml
        kubectl apply -f k8s/service.yaml
