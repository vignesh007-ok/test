apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-app
  labels:
    app: billing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: billing
  template:
    metadata:
      labels:
        app: billing
  # The GitHub Workflow will dynamically replace __IMAGE_TAG__ on every run
    spec:
      containers:
      - name: billing-container
        image: DOCKERHUB_USERNAME/billing-app:__IMAGE_TAG__
        imagePullPolicy: Always
